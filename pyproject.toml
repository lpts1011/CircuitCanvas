[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitcanvas"
dynamic = ["version"]
description = "Interactive RLC circuit builder and transient simulator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Peichi Li"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "PySide6>=6.8,<6.11",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pyinstaller>=6.11",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  # Pinned to one minor version: new ruff releases add rules and format changes.
  "ruff>=0.17,<0.18",
]

[project.scripts]
circuitcanvas = "circuitcanvas.app:main"

[tool.setuptools.dynamic]
# The single place to change the version is src/circuitcanvas/__init__.py.
version = {attr = "circuitcanvas.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"circuitcanvas.examples" = ["*.json"]
"circuitcanvas.resources" = ["*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
# Historical design notes; their code snippets are not maintained as source.
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["circuitcanvas"]
mypy_path = "src"
